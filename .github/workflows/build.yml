- name: Setup 88XXau Driver Automatically
  run: |
    cd $GITHUB_WORKSPACE
    
    # ১. v5.6.4.2 ড্রাইভার ডাউনলোড
    git clone -b v5.6.4.2 --depth=1 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/realtek/rtl8812au
    rm -rf drivers/net/wireless/realtek/rtl8812au/.git
    
    # ২. ড্রাইভারের Makefile প্যাচ করা (মডিউল হিসেবে বিল্ড করার জন্য)
    cd drivers/net/wireless/realtek/rtl8812au
    sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
    sed -i 's/CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/g' Makefile
    cd $GITHUB_WORKSPACE
    
    # ৩. কার্নেলের Kconfig ও Makefile-এ ড্রাইভার রেজিস্ট্রেশন (মডিউল হিসেবে)
    mkdir -p drivers/net/wireless/realtek
    touch drivers/net/wireless/realtek/Kconfig
    touch drivers/net/wireless/realtek/Makefile
    echo 'source "drivers/net/wireless/realtek/rtl8812au/Kconfig"' >> drivers/net/wireless/realtek/Kconfig
    echo 'obj-$(CONFIG_RTL8812AU) += rtl8812au/' >> drivers/net/wireless/realtek/Makefile
    
    # ৪. defconfig ফাইলে ড্রাইভারকে মডিউল (=m) হিসেবে সেট করা
    DEFCONFIG_FILE=$(find arch/arm64/configs -name "lavender-perf_defconfig" | head -n 1)
    echo "Using defconfig: $DEFCONFIG_FILE"
    echo "# CONFIG_RTL8XXXU is not set" >> "$DEFCONFIG_FILE"
    echo "CONFIG_RTL8812AU=m" >> "$DEFCONFIG_FILE"
