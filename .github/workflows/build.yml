name: Build Nethunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fix Broken Submodule Cache
        run: |
          git rm --cached drivers/aircrack/rtl8812au || true
          git submodule update --init --recursive || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-11-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2 libtinfo5 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out ARCH=arm64 lavender-perf_defconfig
          make O=out ARCH=arm64 -j$(nproc) 2>&1 | tee build.log

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          
      - name: Create Flashable ZIP
        run: |
          cd anykernel
          zip -r ../Nethunter-Kernel-Lavender.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-Kernel
          path: Nethunter-Kernel-Lavender.zip
